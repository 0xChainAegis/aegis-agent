name: Team task
description: A small reviewable Aegis task with a clear owner and acceptance check
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: "Read docs/DECISIONS.md and docs/HANDOFF.md first. Never paste secrets. Agents do not merge or send public testnet transactions."
  - type: dropdown
    id: assignee_role
    attributes:
      label: Responsible teammate
      options:
        - MIA — frontend / product
        - purple sun — TypeScript backend / API
        - 某齐 — contracts / tests
        - Integration owner — cross-domain coordination
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected result
      description: Include the latest base commit and link to the daily Agent task. State what is already implemented.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Allowed paths and suggested branch
      description: Keep one domain per task. Shared ABI, dependencies and CI changes need coordination.
      placeholder: "Allowed: frontend/ ...\nBranch: mia/1016-..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link prerequisite PRs; identify human configuration and checks that cannot yet run.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and evidence
      description: Exact commands plus observable business behavior; distinguish local Mock Feed from unverified Sepolia.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: PR and next handoff
      description: Reviewer, expected output and next person's action. Human review/merge only.
    validations:
      required: true
