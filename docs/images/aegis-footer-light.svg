<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="280" viewBox="0 0 1400 280" role="img" aria-labelledby="title desc">
  <title id="title">Aegis — Agent wallet control.</title>
  <desc id="desc">A panoramic Aegis signature with its original A mark, a cool porcelain gradient and flowing iridescent glass ribbons.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1400" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f8f5"/><stop offset=".48" stop-color="#edf4f7"/><stop offset="1" stop-color="#dceafa"/>
    </linearGradient>
    <radialGradient id="wash" cx=".79" cy=".32" r=".67">
      <stop stop-color="#d2fff0" stop-opacity=".92"/><stop offset=".48" stop-color="#d5e7ff" stop-opacity=".55"/><stop offset="1" stop-color="#eef4f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prism" x1="810" y1="285" x2="1310" y2="-35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b2cfea"/><stop offset=".32" stop-color="#a6e4df"/><stop offset=".58" stop-color="#e6f6fc"/><stop offset=".8" stop-color="#c9c5ef"/><stop offset="1" stop-color="#f3d7cb"/>
    </linearGradient>
    <linearGradient id="silk" x1="976" y1="320" x2="1430" y2="-10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7ecff" stop-opacity=".28"/><stop offset=".43" stop-color="#fdfdf7" stop-opacity=".94"/><stop offset=".75" stop-color="#c7e7f5" stop-opacity=".8"/><stop offset="1" stop-color="#acc7ef" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="edge" x1="820" y1="280" x2="1360" y2="-50" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/><stop offset=".47" stop-color="white" stop-opacity=".94"/><stop offset="1" stop-color="white" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="fade" x1="625" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="black"/><stop offset="1" stop-color="white"/></linearGradient>
    <mask id="art"><rect width="1400" height="280" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1400" height="280" rx="25"/></clipPath>
    <filter id="bloom" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="27"/></filter>
  </defs>
  <g clip-path="url(#frame)">
