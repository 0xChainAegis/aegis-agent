      <path d="M790 346C1035 272 1017 73 1211-7C1321-53 1415-20 1500 48" fill="none" stroke="url(#prism)" stroke-width="91" opacity=".88"/>
      <path d="M790 301C1009 233 1000 46 1196-48" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
      <path d="M985 366C1020 178 1185 148 1324 70C1402 27 1430-29 1437-76" fill="none" stroke="url(#silk)" stroke-width="73"/>
      <path d="M949 357C983 181 1167 116 1306 38C1385-7 1400-45 1401-76" fill="none" stroke="url(#edge)" stroke-width="2"/>
      <path d="M1087 342C1164 249 1316 224 1462 240" fill="none" stroke="#f7fbfd" stroke-width="1" opacity=".65"/>
    </g>
    <path d="M52 279H1348" stroke="#a8bfd0" stroke-opacity=".24"/>
    <g transform="translate(74 74) scale(2.05)">
      <rect width="64" height="64" rx="15" fill="white" fill-opacity=".7"/>
      <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#bdc9c9" stroke-opacity=".8"/>
      <g transform="translate(4 3.5) scale(.875)"><path d="M32 7 60 57H46L32 31 18 57H4Z" fill="#252b2a"/><path d="m27 42-6 10h22l-6-10Z" fill="#9aaa9f"/></g>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <text x="244" y="150" fill="#202b2f" font-size="116" font-weight="600" letter-spacing="-5">Aegis</text>
      <text x="250" y="218" fill="#526974" font-size="29" letter-spacing=".25">Agent wallet control.</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1399" height="279" rx="24.5" fill="none" stroke="#a8bdcb" stroke-opacity=".36"/>
